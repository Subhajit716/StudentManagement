spring.application.name=student-management-system
server.port=8080

# When you run the app from IntelliJ, Spring reads the .env file in the project root.
# Inside Docker this file does not exist ("optional:"), and docker compose passes real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ---- Database (values come from environment variables; defaults suit local development) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- Hibernate / JPA ----
# update = create the students table if missing and add missing columns (fine for learning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- CORS: which website addresses may call this API from a browser (comma separated) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}